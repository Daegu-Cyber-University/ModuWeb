name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # CHANGELOG.md에서 해당 버전 섹션 추출
          awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +2 > release_notes.txt
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p release-package
          cp -r dist release-package/
          cp config.example.json release-package/
          cp README.md release-package/
          cp CHANGELOG.md release-package/
          cp LICENSE release-package/
          cd release-package
          zip -r ../moduweb-v${{ steps.version.outputs.VERSION }}.zip .
          cd ..
          tar -czf moduweb-v${{ steps.version.outputs.VERSION }}.tar.gz -C release-package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ModuWeb v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: |
            moduweb-v${{ steps.version.outputs.VERSION }}.zip
            moduweb-v${{ steps.version.outputs.VERSION }}.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
